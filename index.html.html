<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>RFL Keep 4 / Cut 4</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #000;
      color: #f5f5f5;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
      background-repeat: no-repeat;
      background-position: center;
      background-size: contain;
      background-attachment: fixed;
    }
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, rgba(0,0,0,0.15), rgba(0,0,0,0.9));
      pointer-events: none;
      z-index: -1;
    }
    header {
      padding: 16px 24px;
      background: rgba(16,16,16,0.95);
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 2px solid #333;
      backdrop-filter: blur(6px);
    }
    header h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
    .challenge-info {
      font-size: 14px;
      opacity: 0.9;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 24px;
      box-sizing: border-box;
    }
    .controls {
      margin-bottom: 16px;
      display: flex;
      gap: 12px;
      flex-wrap: wrap;
      justify-content: center;
    }
    button {
      border: none;
      padding: 10px 18px;
      border-radius: 999px;
      font-size: 14px;
      cursor: pointer;
      font-weight: 600;
      letter-spacing: 0.03em;
      text-transform: uppercase;
      transition: transform 0.1s ease, box-shadow 0.1s ease, background 0.15s ease, opacity 0.15s ease;
    }
    button:active {
      transform: translateY(1px);
      box-shadow: none;
    }
    button:disabled {
      opacity: 0.4;
      cursor: default;
      box-shadow: none;
      transform: none;
    }
    .btn-primary {
      background: #2163ee;
      color: #fff;
      box-shadow: 0 0 12px rgba(33, 99, 238, 0.5);
    }
    .btn-secondary {
      background: #333;
      color: #f5f5f5;
    }
    .btn-keep {
      background: #1f9d55;
      color: #fff;
      min-width: 120px;
    }
    .btn-cut {
      background: #e3342f;
      color: #fff;
      min-width: 120px;
    }
    .btn-next {
      background: #ffcb05;
      color: #202020;
    }
    .status-bar {
      margin-bottom: 16px;
      font-size: 14px;
      text-align: center;
      opacity: 0.9;
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
    }
    .status-bar span {
      margin: 0 4px;
    }
    .card-area {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 24px;
    }
    .player-card {
      width: 100%;
      max-width: 520px;
      background: rgba(12,12,12,0.96);
      border-radius: 16px;
      padding: 24px 22px 18px;
      box-sizing: border-box;
      box-shadow: 0 0 24px rgba(0,0,0,0.8);
      display: none;
      flex-direction: column;
      gap: 14px;
      position: relative;
      overflow: hidden;
      backdrop-filter: blur(8px);
    }
    .player-card.visible {
      display: flex;
    }
    .player-header {
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .team-logo {
      width: 82px;
      height: 82px;
      border-radius: 12px;
      background: #333;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.12);
    }
    .team-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .player-meta {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .player-name {
      font-size: 26px;
      font-weight: 800;
    }
    .player-team-season {
      font-size: 16px;
      opacity: 0.95;
    }
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 999px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-top: 4px;
    }
    .stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: 6px;
    }
    .stat-pill {
      background: #222;
      border-radius: 999px;
      padding: 10px 14px;
      font-size: 14px;
      display: flex;
      flex-direction: column;
      min-width: 100px;
    }
    .stat-label {
      opacity: 0.7;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    .stat-value {
      font-weight: 700;
      margin-top: 2px;
      font-size: 15px;
    }
    .stat-hidden .stat-value {
      filter: blur(6px);
    }
    .choice-buttons {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 10px;
    }
    .results {
      width: 100%;
      max-width: 1000px;
      display: none;
      flex-direction: column;
      gap: 16px;
      margin-top: 8px;
      background: rgba(10,10,10,0.96);
      border-radius: 16px;
      padding: 16px;
      box-shadow: 0 0 24px rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
    }
    .results.visible {
      display: flex;
    }
    .results-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
    }
    .results-title {
      font-size: 18px;
      font-weight: 700;
    }
    .results-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
    }
    .result-card {
      background: #181818;
      border-radius: 12px;
      padding: 10px 10px 8px;
      box-sizing: border-box;
      border: 2px solid transparent;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .result-card.keep-correct {
      border-color: #1f9d55;
      box-shadow: 0 0 12px rgba(31,157,85,0.5);
    }
    .result-card.keep-wrong {
      border-color: #e3342f;
      box-shadow: 0 0 12px rgba(227,52,47,0.5);
    }
    .result-card.cut-correct {
      border-color: #555;
      opacity: 0.7;
    }
    .result-card-cut-label {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      opacity: 0.7;
    }
    .result-top-row {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .result-logo {
      width: 40px;
      height: 40px;
      border-radius: 10px;
      background: #333;
      overflow: hidden;
      flex-shrink: 0;
    }
    .result-logo img {
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .result-name {
      font-size: 14px;
      font-weight: 600;
    }
    .result-sub {
      font-size: 11px;
      opacity: 0.8;
    }
    .result-stats-row {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 2px;
    }
    .result-stat-pill {
      background: #222;
      border-radius: 999px;
      padding: 4px 8px;
      font-size: 11px;
    }
    .score-line {
      font-size: 14px;
      font-weight: 600;
    }
    .challenge-label {
      font-size: 13px;
      opacity: 0.9;
    }
    .trophy {
      font-size: 18px;
      margin-left: 6px;
    }

    /* Perfect 10 overlay */
    #perfectOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.85);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 999;
      flex-direction: column;
      color: #fff;
      text-align: center;

    }

      font-weight: 900;
      margin-bottom: 8px;
    }
    .perfect-sub {
      font-size: 18px;
      margin-bottom: 16px;
    }
    .confetti {
      position: absolute;
      width: 8px;
      height: 14px;
      background: #ffcb05;
      top: -20px;
      animation: fall 2.5s linear infinite;
      opacity: 0.9;
    }
    @keyframes fall {
      0% { transform: translateY(0) rotate(0deg); }
      100% { transform: translateY(110vh) rotate(360deg); }
    }

    #hofOverlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.9);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 998;

    }

      font-size: 14px;
    }

      width: 100%;
    }

        flex-direction: column;
        align-items: flex-start;
        gap: 6px;
      }
      .player-card {
        padding: 18px 14px 14px;
      }
    }
  </style>
</head>

</main>

  function shuffle(arr, rng = Math.random) {
    const a = arr.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }
  function pickRandom(arr, rng = Math.random) {
    return arr[Math.floor(rng() * arr.length)];
  }
  function mulberry32(seed) {
    return function() {
      let t = seed += 0x6D2B79F5;
      t = Math.imul(t ^ t >>> 15, t | 1);
      t ^= t + Math.imul(t ^ t >>> 7, t | 61);
      return ((t ^ t >>> 14) >>> 0) / 4294967296;
    };
  }
  function dailySeed() {
    const d = new Date();
    const y = d.getFullYear();
    const m = d.getMonth() + 1;
    const day = d.getDate();
    return y * 10000 + m * 100 + day;
  }
  function teamsWithMultipleSeasons() {
    const seasonsByTeam = {};
    [...qbs, ...recs].forEach(p => {
      if (!seasonsByTeam[p.team]) seasonsByTeam[p.team] = new Set();
      seasonsByTeam[p.team].add(p.season);
    });
    return Object.keys(seasonsByTeam).filter(t => seasonsByTeam[t].size >= 2);
  }

  function setBackgroundForTeam(teamName) {
    const teamInfo = teams[teamName];
    if (!teamInfo) return;
    document.body.style.backgroundColor = teamInfo.primary;
    if (teamInfo.logo) {
      document.body.style.backgroundImage = `url(${teamInfo.logo})`;

  function buildChallenge(rng = Math.random) {
    const types = ["bestTeam", "bestSeason", "qbStat", "recStat"];
    let type = pickRandom(types, rng);
    if (type === "bestTeam" && eligibleBestOfTeams.length === 0) {
      type = pickRandom(["bestSeason", "qbStat", "recStat"], rng);
    }

    let description = "";
    let subtitle = "";
    let pool = [];
    let statKey = null;
    let mode = null;

    if (type === "bestTeam") {
      const team = pickRandom(eligibleBestOfTeams, rng);
      pool = [...qbs, ...recs].filter(p => p.team === team);
      pool = shuffle(pool, rng).slice(0, 8);
      mode = "MIX";
      description = `Best of ${team}`;
      subtitle = `Pick the 4 best seasons from all ${team} players (QBs, WRs, TEs).`;
      showStatsDuringPicks = true;
    } else if (type === "bestSeason") {
      const season = pickRandom([1,2,3,4], rng);
      pool = [...qbs, ...recs].filter(p => p.season === season);
      pool = shuffle(pool, rng).slice(0, 8);
      mode = "MIX";
      description = `Best of Season ${season}`;
      subtitle = `Pick the 4 best seasons from all players in Season ${season}.`;
      showStatsDuringPicks = true;
    } else if (type === "qbStat") {
      const statOptions = [
        { key:"yards", label:"Passing Yards" },
        { key:"td", label:"Passing TDs" },
        { key:"comp", label:"Completions" },
        { key:"int", label:"Fewest INT (lower is better)", inverse:true }
      ];
      const chosen = pickRandom(statOptions, rng);
      statKey = chosen.key;
      mode = "QB";
      pool = shuffle(qbs, rng).slice(0, 8);
      description = `QB Challenge – ${chosen.label}`;
      subtitle = `Keep the 4 best QB seasons by ${chosen.label}.`;
      showStatsDuringPicks = false;
    } else if (type === "recStat") {
      const statOptions = [
        { key:"recYds", label:"Receiving Yards" },
        { key:"recTd", label:"Receiving TDs" },
        { key:"rec", label:"Receptions" }
      ];
      const chosen = pickRandom(statOptions, rng);
      statKey = chosen.key;
      mode = "REC";
      pool = shuffle(recs, rng).slice(0, 8);
      description = `Receiver Challenge – ${chosen.label}`;
      subtitle = `Keep the 4 best WR/TE seasons by ${chosen.label}.`;
      showStatsDuringPicks = false;
    }

    currentChallenge = { type, description, subtitle, statKey, mode };
    currentPlayers = pool;
    currentIndex = 0;
    choices = [];
    resetKeepsCuts();
    updateHeader();
    updateProgress();
    showCurrentPlayer();
    resultsPanel.classList.remove("visible");
    playerCard.classList.add("visible");
    statusScore.textContent = "";
  }

  function buildDailyChallenge() {
    const today = new Date().toISOString().slice(0,10);
    if (dailyCompletedDate === today) {
      headerChallenge.textContent = "Daily Game (Already Completed)";
      btnDaily.disabled = true;
      btnDaily.textContent = "Daily Completed";
      return;
    }
    const seed = dailySeed();
    const rng = mulberry32(seed);
    isDaily = true;
    buildChallenge(rng);
    headerChallenge.textContent = currentChallenge.description + " (Daily)";
  }

  function buildUnlimitedChallenge() {
    isDaily = false;
    buildChallenge(Math.random);
  }

  function updateHeader() {
    headerChallenge.textContent = currentChallenge
      ? currentChallenge.description + (isDaily ? " (Daily)" : " (Unlimited)")
      : "";

  }

    statusProgress.textContent = currentPlayers.length

      : "";

  function showCurrentPlayer() {
    if (!currentPlayers.length || currentIndex >= currentPlayers.length) {
      playerCard.classList.remove("visible");
      showResults();
      return;
    }
    const p = currentPlayers[currentIndex];

    playerName.textContent = p.name;

    } else {
      playerLogo.removeAttribute("src");
      playerLogo.alt = "";
    }

    playerStatsRow.innerHTML = "";
    const statsToShow = [];
    if (p.pos === "QB") {
      statsToShow.push(
        { label:"Comp", value:p.comp },
        { label:"Yards", value:p.yards },
        { label:"TD", value:p.td },
        { label:"INT", value:p.int }
      );
    } else {
      statsToShow.push(
        { label:"Rec", value:p.rec },
        { label:"Yards", value:p.recYds },
        { label:"TD", value:p.recTd }
      );
    }

    statsToShow.forEach(s => {
      const pill = document.createElement("div");
      pill.className = "stat-pill";
      if (!showStatsDuringPicks && (currentChallenge.type === "qbStat" || currentChallenge.type === "recStat")) {
        pill.classList.add("stat-hidden");

      const lab = document.createElement("div");
      lab.className = "stat-label";

      val.className = "stat-value";
      val.textContent = s.value;
      pill.appendChild(lab);
      pill.appendChild(val);
      playerStatsRow.appendChild(pill);
    });

    updateKeepsCutsStatus();
    btnKeep.disabled = keepsLeft <= 0;
    btnCut.disabled = cutsLeft <= 0;
  }

  function handleChoice(keep) {
    if (!currentPlayers.length || currentIndex >= currentPlayers.length) return;
    if (keep && keepsLeft <= 0) return;
    if (!keep && cutsLeft <= 0) return;

    const p = currentPlayers[currentIndex];
    choices.push({ player: p, keep });

    if (keep) keepsLeft--;
    else cutsLeft--;

    updateKeepsCutsStatus();
    btnKeep.disabled = keepsLeft <= 0;
    btnCut.disabled = cutsLeft <= 0;

    currentIndex++;
    updateProgress();
    if (currentIndex >= currentPlayers.length) {
      playerCard.classList.remove("visible");
      showResults();
    } else {
      showCurrentPlayer();
    }
  }

  function computeScore() {
    const type = currentChallenge.type;
    const statKey = currentChallenge.statKey;
    let ranked = currentPlayers.slice();

    if (type === "bestTeam" || type === "bestSeason") {
      ranked.sort((a,b) => {
        const va = a.pos === "QB" ? a.yards : a.recYds;
        const vb = b.pos === "QB" ? b.yards : b.recYds;
        return vb - va;
      });
    } else if (type === "qbStat") {
      ranked.sort((a,b) => {
        if (statKey === "int") return a.int - b.int;
        if (statKey === "yards") return b.yards - a.yards;
        if (statKey === "td") return b.td - a.td;
        if (statKey === "comp") return b.comp - a.comp;
        return 0;
      });
    } else if (type === "recStat") {
      ranked.sort((a,b) => {
        if (statKey === "recYds") return b.recYds - a.recYds;
        if (statKey === "recTd") return b.recTd - a.recTd;
        if (statKey === "rec") return b.rec - a.rec;
        return 0;
      });
    }

    const top4 = ranked.slice(0,4);
    const isTop4 = new Set(top4.map(p => p));

    let correctKeeps = 0;
    let totalKeeps = 0;

    choices.forEach(c => {
      if (c.keep) {
        totalKeeps++;
        if (isTop4.has(c.player)) correctKeeps++;
      }
    });

    return { correctKeeps, totalKeeps, top4Set: isTop4 };
  }

      c.style.transform = `rotate(${Math.random()*360}deg)`;
      perfectOverlay.appendChild(c);
      setTimeout(() => c.remove(), 3000);
    }
  }

  function showPerfectAnimation() {

  function showResults() {
    const { correctKeeps, totalKeeps, top4Set } = computeScore();

    let justEarnedMeat = false;
    let justPerfectGame = false;

    if (correctKeeps === 4) {
      streak++;
      justPerfectGame = true;
      perfectGames++;
      lastPerfectDate = new Date().toISOString().slice(0,10);
      if (streak > bestStreak) bestStreak = streak;
      if (streak === 10) {
        meatCount++;
        justEarnedMeat = true;
      }
    } else {
      streak = 0;
    }

    saveProgress();
    updateStreakStatus();

    resultsTitle.textContent = currentChallenge.description + (isDaily ? " (Daily)" : "");
    resultsSubtitle.textContent = currentChallenge.subtitle;
    resultsScore.textContent = `Correct Keeps: ${correctKeeps} of 4`;

    const streakMessage = document.createElement("div");
    streakMessage.style.fontSize = "14px";
    streakMessage.style.fontWeight = "600";
    streakMessage.style.marginTop = "4px";

    if (streak >= 10) {
      streakMessage.textContent = `🔥 STREAK: ${streak} — You earned Klanke's Meat FREE for the whole day! 🔥`;

      streakMessage.textContent = `Streak: ${streak} (Best: ${bestStreak})`;
    }

    const meatMessage = document.createElement("div");
    meatMessage.style.fontSize = "13px";

    resultsScore.appendChild(document.createElement("br"));
    resultsScore.appendChild(streakMessage);
    resultsScore.appendChild(meatMessage);

    if (justEarnedMeat) {
      const trophy = document.createElement("span");
      trophy.className = "trophy";
      trophy.textContent = "🏆";
      streakMessage.appendChild(trophy);
      showPerfectAnimation();
    } else if (justPerfectGame) {
      // subtle flash if perfect but not 10th
      showPerfectAnimation();
      setTimeout(() => perfectOverlay.classList.remove("visible"), 1200);
    }

    statusScore.textContent = `Correct Keeps: ${correctKeeps} of 4`;

    resultsGrid.innerHTML = "";
    currentPlayers.forEach(p => {
      const teamInfo = teams[p.team] || { primary:"#444", secondary:"#222", logo:"" };
      const choice = choices.find(c => c.player === p);
      const kept = choice ? choice.keep : false;
      const correctTop = top4Set.has(p);

      const card = document.createElement("div");
      card.className = "result-card";

      if (kept && correctTop) card.classList.add("keep-correct");
      else if (kept && !correctTop) card.classList.add("keep-wrong");
      else if (!kept && correctTop) card.classList.add("cut-correct");

      const topRow = document.createElement("div");

      const cutLabel = document.createElement("div");

      statsRow.className = "result-stats-row";

      if (p.pos === "QB") {
        ["comp","yards","td","int"].forEach(k => {
          const pill = document.createElement("div");
          pill.className = "result-stat-pill";
          if (k === "comp") pill.textContent = `Comp: ${p.comp}`;
          if (k === "yards") pill.textContent = `Yds: ${p.yards}`;
          if (k === "td") pill.textContent = `TD: ${p.td}`;
          if (k === "int") pill.textContent = `INT: ${p.int}`;
          statsRow.appendChild(pill);
        });
      } else {
        ["rec","recYds","recTd"].forEach(k => {
          const pill = document.createElement("div");
          pill.className = "result-stat-pill";
          if (k === "rec") pill.textContent = `Rec: ${p.rec}`;
          if (k === "recYds") pill.textContent = `Yds: ${p.recYds}`;
          if (k === "recTd") pill.textContent = `TD: ${p.recTd}`;
          statsRow.appendChild(pill);
        });
      }

      card.appendChild(statsRow);
      resultsGrid.appendChild(card);
    });

    resultsPanel.classList.add("visible");

    if (isDaily) {
      markDailyCompleted();
    }
  }

  function openHallOfFame() {
    hofBestStreak.textContent = `Best Streak: ${bestStreak}`;
    hofPerfectGames.textContent = `Perfect Games (4/4 Keeps): ${perfectGames}`;
    hofMeatDays.textContent = `Klanke's Meat Days Earned: ${meatCount}`;
    hofLastPerfect.textContent = lastPerfectDate
      ? `Last Perfect Game: ${lastPerfectDate}`
      : `Last Perfect Game: —`;
    hofOverlay.classList.add("visible");
  }

  function buildShareText() {
    if (!currentChallenge || !currentPlayers.length || !choices.length) {
      return "RFL Keep 4 / Cut 4 – No completed game to share yet.";
    }
    const { correctKeeps } = computeScore();
    let title = `RFL Keep 4 / Cut 4 – ${currentChallenge.description}`;
    if (isDaily) title += " (Daily)";
    const scoreLine = `Correct Keeps: ${correctKeeps}/4 | Streak: ${streak} (Best ${bestStreak})`;

    const { top4Set } = computeScore();
    const row = currentPlayers.map(p => {
      const choice = choices.find(c => c.player === p);
      const kept = choice ? choice.keep : false;
      const correctTop = top4Set.has(p);
      if (kept && correctTop) return "🟩";
      if (kept && !correctTop) return "🟥";
      if (!kept && correctTop) return "🟦";
      return "⬜";
    }).join("");

    return `${title}\n${scoreLine}\n${row}`;
  }

  async function shareResult() {
    const text = buildShareText();
    try {
      await navigator.clipboard.writeText(text);
      alert("Result copied to clipboard!");
    } catch (e) {
      alert(text);
    }
  }

  btnKeep.addEventListener("click", () => handleChoice(true));
  btnCut.addEventListener("click", () => handleChoice(false));
  btnDaily.addEventListener("click", () => buildDailyChallenge());
  btnUnlimited.addEventListener("click", () => buildUnlimitedChallenge());
  btnNextChallenge.addEventListener("click", () => buildUnlimitedChallenge());
  btnHOF.addEventListener("click", () => openHallOfFame());
  btnShare.addEventListener("click", () => shareResult());
  btnShareResults.addEventListener("click", () => shareResult());

  perfectClose.addEventListener("click", () => {
    perfectOverlay.classList.remove("visible");
    [...perfectOverlay.querySelectorAll(".confetti")].forEach(c => c.remove());
  });

  hofClose.addEventListener("click", () => {
    hofOverlay.classList.remove("visible");
  });

  loadProgress();
  updateStreakStatus();
  const today = new Date().toISOString().slice(0,10);
  if (dailyCompletedDate === today) {
    btnDaily.disabled = true;
    btnDaily.textContent = "Daily Completed";
  }
  buildDailyChallenge();
</script>
</body>
</html>
